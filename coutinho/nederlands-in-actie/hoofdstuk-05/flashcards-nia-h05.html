  else if (e.key === "ArrowLeft") back();
  else if (e.key === "ArrowDown") { e.preventDefault(); setFlip(true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setFlip(false); }
});
if (st.decks.length !== 1 || !DECKS.includes(st.decks[0])) st.decks = [DECKS[0]];
build(false);
